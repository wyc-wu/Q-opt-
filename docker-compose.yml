services:
  q-opt:
    image: q-opt:v3.0
    container_name: q-opt-v3
    restart: always
    ports:
      - "8010:8000"
    environment:
      - TZ=Asia/Taipei
      - PYTHONUNBUFFERED=1
    volumes:
      # 持久化資料庫、日誌與環境設定
      - ./orders.db:/app/orders.db
      - ./playwright_debug.log:/app/playwright_debug.log
      - ./.env:/app/.env
